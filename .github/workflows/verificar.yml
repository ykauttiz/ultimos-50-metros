name: Verificar projeto
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  motor:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: python3 prepare_offline.py && git diff --exit-code -- sw.js
      - run: node --test
  interface:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        engine: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.55.0
      - if: matrix.engine == 'firefox'
        run: python -m playwright install firefox
      - run: python tests/browser.py
        env:
          ENGINE: ${{ matrix.engine }}
          CAPTURAR_DEMO: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: capturas-${{ matrix.engine }}
          path: capturas/*.png
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(v')
    needs: [motor, interface]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publicar marco testado
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject=${COMMIT_MESSAGE%%$'\n'*}
          pattern='^release\((v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)\) (.+)$'
          if ! [[ $subject =~ $pattern ]]; then
            echo "Use release(vAAAA.MM.DD) seguido do título." >&2
            exit 1
          fi
          tag=${BASH_REMATCH[1]}
          title=${BASH_REMATCH[3]}
          test -s RELEASE.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file RELEASE.md

