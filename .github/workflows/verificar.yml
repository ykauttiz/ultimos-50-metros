name: Verificar projeto
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  motor:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: python3 prepare_offline.py && git diff --exit-code -- sw.js
      - run: node --test
  interface:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        engine: [chromium, firefox]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.55.0
      - if: matrix.engine == 'firefox'
        run: python -m playwright install firefox
      - run: python tests/browser.py
        env:
          ENGINE: ${{ matrix.engine }}
          CAPTURAR_DEMO: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ matrix.engine }}
          path: capturas/*.png
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(v2026.11.21)')
    needs: [motor, interface]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Publicar marco testado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2026.11.21 --target "$GITHUB_SHA" --title "Atualização de 21 de novembro" --notes-file RELEASE.md

