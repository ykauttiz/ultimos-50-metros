<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Últimos 50 Metros</title>
<style>:root{color-scheme:dark;font:17px/1.55 system-ui,sans-serif;background:#172421;color:#f6f4e8}body{max-width:58rem;margin:0 auto;padding:clamp(1rem,4vw,4rem)}header{padding-bottom:1rem;border-bottom:1px solid #728880}a{color:inherit}h1{font:normal clamp(2.7rem,8vw,5.6rem)/1 Georgia,serif;margin:2rem 0 .6rem}form{background:#22332f;border-radius:12px;padding:1rem;margin:1.5rem 0}label{display:grid;gap:.3rem;margin:.5rem 0}input,textarea,select,button{font:inherit;padding:.5rem;box-sizing:border-box;max-width:100%}button{background:#ffc483;color:#172421;border:0;border-radius:5px;cursor:pointer;margin:.5rem 0}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.5rem;border-bottom:1px solid #62766d;overflow-wrap:anywhere}main{overflow-x:auto}textarea{width:100%}:focus-visible{outline:3px solid white;outline-offset:2px}</style>
<header><a href="https://github.com/ykauttiz/ultimos-50-metros">Código e instruções ↗</a></header><main><h1>Últimos 50 Metros</h1><p>Registre o que encontrou entre a calçada e o embarque.</p>
<form><label>Ponto<input required id="point" maxlength="120" placeholder="Ex. Praça das Flores · sentido centro"></label>
<label>Data da vistoria<input required id="date" type="date"></label><div id="parts"></div>
<label>Observação<textarea id="note" maxlength="600"></textarea></label><button>Salvar vistoria</button></form>
<button id="demo">Ver exemplo fictício</button> <button id="export">Exportar histórico JSON</button>
<p>A lista prioriza barreiras e trechos sem vistoria. Cada linha mostra a observação mais recente daquele ponto.</p>
<table><thead><tr><th>Ponto</th><th>Data</th><th>Prioridade</th><th>Observação</th></tr></thead><tbody></tbody></table><p role="status" id="message"></p></main><script src="core.js"></script><script src="app.js"></script></html>
